<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Страница не найдена — Гондусов Денис</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #81D8D0;
        color: #1a1a1a;
        padding: 24px;
        text-align: center;
      }
      .box {
        background: #fff;
        border-radius: 28px;
        padding: 56px 40px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      }
      .code {
        font-size: 96px;
        font-weight: 900;
        line-height: 1;
        color: #0ABAB5;
        letter-spacing: -3px;
      }
      h1 { font-size: 24px; font-weight: 800; margin: 16px 0 12px; }
      p { font-size: 16px; line-height: 1.6; color: #666; margin-bottom: 28px; }
      a.btn {
        display: inline-block;
        background: #0ABAB5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        padding: 15px 36px;
        border-radius: 30px;
        transition: background 0.2s, transform 0.2s;
      }
      a.btn:hover { background: #009b96; transform: translateY(-1px); }
      .phone { margin-top: 20px; font-size: 14px; color: #888; }
      .phone a { color: #0ABAB5; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>Возможно, страница была удалена или вы ошиблись в адресе.</p>
      <a class="btn" href="/">Вернуться на главную</a>
      <div class="phone">Запись на приём: <a href="tel:+79896287794">+7 989 628 7794</a></div>
    </div>
  </body>
</html>
